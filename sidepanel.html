<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SidePanel AI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>SidePanel AI</h1>
    <div id="status-container">
      <p id="status-message">Welcome!</p>
    </div>
    <div id="controls">
      <button id="extract-btn">Extract Subtitles</button>
      <input type="text" id="api-key-input" placeholder="Enter YouTube API Key (optional)">
    </div>
    <div id="transcript-container"></div>
    <div id="error-container"></div>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
